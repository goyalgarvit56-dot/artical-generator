<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini News Article Generator</title>
<style>
  :root {
    --paper: #eef1f5;
    --card: #ffffff;
    --ink: #14213d;
    --muted: #55607a;
    --line: #cfd6e2;
    --signal: #c8102e;
    --signal-dark: #9d0c23;
    --error-bg: #fdecee;
    --ok: #1b7f4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1626;
      --card: #172036;
      --ink: #eef1f7;
      --muted: #a3adc4;
      --line: #2c3856;
      --signal: #ff4d63;
      --signal-dark: #e03a50;
      --error-bg: #3a1620;
      --ok: #5fd196;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
    padding: 20px 16px 48px;
  }
  main { max-width: 720px; margin: 0 auto; }
  header { border-left: 6px solid var(--signal); padding-left: 14px; margin: 8px 0 24px; }
  h1 { font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type="text"] {
    width: 100%; font: inherit; color: inherit; background: var(--paper);
    border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  input[type="text"]:focus { outline: 3px solid var(--signal); outline-offset: 1px; border-color: transparent; }

  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 12px 18px; border: 0;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #generate { background: var(--signal); color: #fff; width: 100%; margin-top: 14px; }
  #generate:hover:not(:disabled) { background: var(--signal-dark); }
  #generate:disabled { opacity: 0.6; cursor: not-allowed; }
  #copy { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  #copy:hover { border-color: var(--ink); }

  .status { margin-top: 16px; }
  #loading { display: none; align-items: center; gap: 10px; color: var(--muted); }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--signal);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  #error {
    display: none; background: var(--error-bg); border-left: 5px solid var(--signal);
    border-radius: 6px; padding: 12px 14px;
  }

  #result { display: none; margin-top: 20px; }
  .result-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .result-bar h2 { font-size: 1rem; margin: 0; color: var(--muted); font-weight: 600; }
  #copy-note { color: var(--ok); font-size: 0.9rem; margin-left: 10px; }
  #article {
    font-family: Georgia, "Times New Roman", serif; font-size: 1.1rem; line-height: 1.7;
    white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gemini News Article Generator</h1>
    <p>Type a topic and get a short news article written by Google Gemini.</p>
  </header>

  <section class="panel">
    <label for="topic">Enter Your Topic</label>
    <input type="text" id="topic" maxlength="200" autocomplete="off" placeholder="Example: New metro line opens in Lucknow">
    <button id="generate" type="button">Generate Article</button>

    <div class="status" aria-live="polite">
      <div id="loading"><div class="spinner"></div><span>Writing your article. This can take up to 30 seconds.</span></div>
      <div id="error" role="alert"></div>
    </div>

    <div id="result">
      <div class="result-bar">
        <h2>Your article</h2>
        <div><button id="copy" type="button">Copy Article</button><span id="copy-note"></span></div>
      </div>
      <div id="article"></div>
    </div>
  </section>
</main>

<script>
  const topicInput = document.getElementById("topic");
  const generateBtn = document.getElementById("generate");
  const loadingEl = document.getElementById("loading");
  const errorEl = document.getElementById("error");
  const resultEl = document.getElementById("result");
  const articleEl = document.getElementById("article");
  const copyBtn = document.getElementById("copy");
  const copyNote = document.getElementById("copy-note");

  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = "block";
  }

  async function generate() {
    const topic = topicInput.value.trim();
    errorEl.style.display = "none";
    copyNote.textContent = "";

    if (!topic) {
      resultEl.style.display = "none";
      showError("Please enter a topic before clicking Generate Article.");
      topicInput.focus();
      return;
    }

    generateBtn.disabled = true;
    resultEl.style.display = "none";
    loadingEl.style.display = "flex";

    try {
      const response = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Something went wrong. Please try again.");

      articleEl.textContent = data.article;
      resultEl.style.display = "block";
      resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch (err) {
      const offline = err instanceof TypeError;
      showError(offline
        ? "Could not reach the server. Check your internet connection and try again."
        : err.message);
    } finally {
      loadingEl.style.display = "none";
      generateBtn.disabled = false;
    }
  }

  async function copyArticle() {
    const text = articleEl.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Fallback for browsers that block the clipboard API
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      try { document.execCommand("copy"); } catch {}
      area.remove();
    }
    copyNote.textContent = "Copied";
    setTimeout(() => { copyNote.textContent = ""; }, 2000);
  }

  generateBtn.addEventListener("click", generate);
  topicInput.addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });
  copyBtn.addEventListener("click", copyArticle);
</script>
</body>
</html>
